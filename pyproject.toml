[project]
name = "simple-portfolio"
version = "0.1.0"
description = "Anchored volatility-limited Markowitz portfolios on prepared pandas inputs"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "cvxpy>=1.8.2",
    "numpy>=2.4",
    "pandas>=3.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/simple_portfolio"]
