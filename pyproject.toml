[project]
name = "simple-dynamic-portfolios"
version = "0.1.0"
description = "Anchored volatility-limited Markowitz portfolios for any asset universe, on prepared pandas inputs"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "cvxpy>=1.8.2",
    "numpy>=2.4",
    "pandas>=3.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/simple_dynamic_portfolios"]

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
    "nbclient>=0.11.0",
    "plotly>=7.1.0",
    "pyarrow>=25.0.1",
    "yfinance>=1.7.0",
]
